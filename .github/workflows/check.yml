# Full CI for the dev branch only. main keeps Greg's minimal r.yml.
name: check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: release}
          - {os: ubuntu-latest,  r: oldrel-1}
          - {os: ubuntu-latest,  r: devel}
          - {os: ubuntu-latest,  r: '4.1'}   # lowest supported (DESCRIPTION: R >= 4.1.0)
          - {os: windows-latest, r: release}
          - {os: macos-latest,   r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'   # stricter than main: warnings fail the build
          upload-snapshots: true

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Test coverage (fails under 80%)
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          print(cov)
          pct <- covr::percent_coverage(cov)
          if (pct < 80) stop(sprintf("coverage %.1f%% < 80%%", pct))
        shell: Rscript {0}
